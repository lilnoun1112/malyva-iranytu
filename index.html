<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mályvavirág iránytű</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Open+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="wizard.css">
</head>
<body>
  <main class="page">
    <section class="intro" aria-labelledby="introTitle">
      <h2 id="introTitle">Miben segíthetünk?</h2>
      <p>Ha nem tudod pontosan, merre indulj tovább, akkor válaszolj néhány kérdésünkre, így könnyebben megtalálod a számodra fontos információkat az oldalainkon.</p>
    </section>

    <section class="iranytu" id="iranytu" aria-label="Iránytű">
      <h3 class="sentence" id="sentence" aria-live="polite">Betöltés…</h3>
      <ul class="options" id="options"></ul>
      <div class="results" id="results" hidden></div>
      <div class="controls" id="controls" hidden>
        <button type="button" class="ctl" id="backBtn"><span aria-hidden="true">←</span> Vissza</button>
        <button type="button" class="ctl" id="resetBtn">Újrakezdem</button>
      </div>
    </section>

    <div class="proto-bar">
      <span>Prototípus · a mondat bármelyik kiválasztott részére kattintva visszaléphetsz</span>
      <button type="button" class="ctl ctl-dark" id="editorToggle" aria-pressed="false">Szerkesztői nézet</button>
    </div>

    <section class="editor" id="editor" hidden></section>
  </main>

  <script src="data/fallback.js"></script>
  <script src="wizard.js"></script>
</body>
</html>
